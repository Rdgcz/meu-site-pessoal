<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Rodrigo Cezar - Desenvolvedor Front-End e Designer">
  <meta name="keywords" content="frontend, design, ux, ui, desenvolvimento web, portfolio">
  <meta name="author" content="Rodrigo Cezar da Silva">
  <title>RDGCZ - Portfólio Pessoal</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Orbitron:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" href="assets/images/favicon/favicon-32x32.png" type="image/png">
  <style>
    :root {
      --bg-color: #0d0d1a;
      --text-color: #e0f7fa;
      --accent-color: #00f0ff;
      --accent-secondary: #0066ff;
      --card-bg: rgba(0, 48, 73, 0.3);
      --separator-color: #003d66;
      --search-border: #0066ff;
      --glow-effect: 0 0 8px rgba(0, 240, 255, 0.5);
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2rem;
      --space-xl: 3rem;
      --radius-sm: 4px;
      --radius-md: 8px;
      --transition-normal: 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: var(--space-sm);
      background-color: var(--bg-color);
      color: var(--text-color);
      text-align: center;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* === EFETO SCANLINE NO BACKGROUND === */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
          transparent 95%, 
          rgba(0, 240, 255, 0.03) 95.5%,
          transparent 96%
      );
      background-size: 100% 8px;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: -1;
      opacity: 0.5;
    }
    
    @keyframes scanline {
      0% { top: 0; }
      100% { top: 100%; }
    }

    h1 {
      position: absolute;
      top: var(--space-md);
      left: var(--space-lg);
      color: var(--accent-color);
      text-shadow: var(--glow-effect);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      padding-left: var(--space-sm);
      background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(255,255,255,0.2), rgba(255,255,255,0.8));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-size: 200% 100%;
      animation: metallicShine 8s linear infinite;
    }

    @keyframes metallicShine {
      0% { background-position: 0% center; }
      100% { background-position: -200% center; }
    }

    .digital-clock {
      position: absolute;
      top: var(--space-md);
      right: var(--space-lg);
      text-align: center;
      color: var(--accent-color);
      text-shadow: var(--glow-effect);
      font-size: 0.9rem;
    }

    .time {
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    .date {
      opacity: 0.8;
      font-size: 0.8rem;
    }

    .slogan {
      margin: 20px 0 15px 0;
      font-style: italic;
      opacity: 0.8;
      font-size: clamp(1rem, 3vw, 1.5rem);
    }

    .separator {
      height: 1px;
      background-color: var(--separator-color);
      margin: var(--space-sm) auto;
      width: 100%;
      max-width: 1200px;
      opacity: 0.5;
    }

    .search-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      max-width: 500px;
      margin: 10px auto;
      width: 90%;
    }

    .search-bar {
      width: 100%;
      padding: 10px 18px;
      border: 1px solid var(--search-border);
      border-radius: 24px;
      background-color: rgba(0, 20, 40, 0.5);
      color: var(--text-color);
      font-family: 'Orbitron', sans-serif;
      outline: none;
      transition: var(--transition-normal);
    }

    .search-bar:focus {
      border-color: var(--accent-color);
      box-shadow: var(--glow-effect);
    }

    .search-button {
      padding: 10px 12px;
      background-color: rgba(0, 102, 255, 0.2);
      border: 1px solid var(--accent-secondary);
      border-radius: 50%;
      color: var(--accent-color);
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition-normal);
      margin-left: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-button:hover,
    .search-button:focus {
      background-color: rgba(0, 102, 255, 0.4);
      box-shadow: var(--glow-effect);
      outline: none;
      transform: scale(1.05);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--space-md);
      max-width: 1200px;
      margin: var(--space-md) auto;
      padding: var(--space-md);
      width: 100%;
    }

    .card {
      background: linear-gradient(135deg, rgba(0,48,73,0.3), rgba(0,20,40,0.5));
      border: 2px solid rgba(0, 150, 255, 0.2);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      cursor: pointer;
      transition: var(--transition-normal);
      transform-origin: center center;
      height: 100%;
      max-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
    }

    .card:hover,
    .card:focus-within {
      transform: scale(1.05);
      box-shadow: var(--glow-effect);
      border-color: var(--accent-color);
      outline: none;
    }

    .card-title {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 1.2rem;
      margin-bottom: var(--space-xs);
    }

    .card-desc {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      height: 100%;
      display: block;
    }

    footer {
      margin-top: 10px;
      padding: var(--space-sm) 0;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
    }

    /* Acessibilidade - reduzir movimento */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
      
      body::after {
        display: none;
      }
      
      .card:hover,
      .card:focus-within {
        transform: none;
      }
    }

    /* Focus styles para acessibilidade */
    a:focus,
    button:focus {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .search-container {
        flex-direction: column;
        gap: var(--space-sm);
      }
      
      .search-button {
        margin-left: 0;
        margin-top: var(--space-sm);
        width: 100%;
        border-radius: 24px;
      }
      
      h1 {
        position: static;
        margin-top: var(--space-md);
        text-align: center;
      }
      
      .digital-clock {
        position: static;
        margin: var(--space-sm) auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>RDGCZ</h1>
    <div class="digital-clock" aria-live="polite">
      <div class="time" id="time">HH:MM</div>
      <div class="date" id="date">Data</div>
    </div>
    
    <div class="search-container">
      <input type="text" id="google-search" class="search-bar" aria-label="Pesquisar no Google" placeholder="Pesquisar no Google...">
      <button type="button" class="search-button" aria-label="Buscar">
        <i class="fas fa-search" aria-hidden="true"></i>
        <span class="sr-only">Buscar</span>
      </button>
    </div>
  </header>
  
  <main>
    <div class="separator" role="separator"></div>
    <p class="slogan">Sempre em desenvolvimento...</p>
    <div class="separator" role="separator"></div>
    
    <div class="cards-grid">
      <a href="sobre.html" class="card-link" aria-label="Sobre Rodrigo Cezar">
        <div class="card" tabindex="0">
          <div class="card-title">SOBRE</div>
          <div class="card-desc">Informações pessoais</div>
        </div>
      </a>
      
      <a href="projetos.html" class="card-link" aria-label="Projetos em andamento">
        <div class="card" tabindex="0">
          <div class="card-title">PROJETOS</div>
          <div class="card-desc">Trabalhos em andamento</div>
        </div>
      </a>
      
      <a href="portfolio.html" class="card-link" aria-label="Portfólio profissional">
        <div class="card" tabindex="0">
          <div class="card-title">PORTFÓLIO</div>
          <div class="card-desc">Cases e experiências</div>
        </div>
      </a>
      
      <a href="ferramentas.html" class="card-link" aria-label="Ferramentas de desenvolvimento">
        <div class="card" tabindex="0">
          <div class="card-title">FERRAMENTAS</div>
          <div class="card-desc">Desenvolvimento WEB e +</div>
        </div>
      </a>
      
      <a href="hobbies.html" class="card-link" aria-label="Hobbies e interesses">
        <div class="card" tabindex="0">
          <div class="card-title">HOBBIES</div>
          <div class="card-desc">Paixões além do trabalho</div>
        </div>
      </a>
      
      <a href="me-inspira.html" class="card-link" aria-label="Inspirações criativas">
        <div class="card" tabindex="0">
          <div class="card-title">INSPIRAÇÕES</div>
          <div class="card-desc">Letras e imagens</div>
        </div>
      </a>
    </div>
  </main>
  
  <footer role="contentinfo">
    <p>© <span id="current-year"></span> - RDGCZ - Todos os direitos reservados.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Update year in footer
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      // Digital clock functionality
      const timeElement = document.getElementById('time');
      const dateElement = document.getElementById('date');
      
      function updateClock() {
        const now = new Date();
        timeElement.textContent = now.toLocaleTimeString('pt-BR', { hour12: false });
        dateElement.textContent = now.toLocaleDateString('pt-BR', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        }).replace(/^./, str => str.toUpperCase());
      }
      
      // Update immediately and then every second
      updateClock();
      const clockInterval = setInterval(updateClock, 1000);
      
      // Search functionality
      function performSearch() {
        const term = document.getElementById('google-search').value.trim();
        if (term) {
          window.open(`https://www.google.com/search?q=${encodeURIComponent(term)}`, '_blank', 'noopener,noreferrer');
        }
      }
      
      document.querySelector('.search-button').addEventListener('click', performSearch);
      
      document.getElementById('google-search').addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          performSearch();
        }
      });
      
      // Cleanup function for animations
      function cleanupAnimations() {
        clearInterval(clockInterval);
      }
      
      // Cleanup on page hide to save resources
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          cleanupAnimations();
        } else {
          updateClock();
          clockInterval = setInterval(updateClock, 1000);
        }
      });
      
      // Cleanup before page unload
      window.addEventListener('beforeunload', cleanupAnimations);
    });
  </script>
</body>
</html>
